## 💰 Funding & Investment Strategy

### Funding Objective

OmniStock aims to raise **₹5–10 lakh in pre-seed funding** to strengthen its prototype, validate its technology and conduct pilot implementations in commercial kitchens.

Our preferred funding approach combines non-dilutive government grants, incubation support and strategic angel investment.

### Proposed Funding Allocation

| Area | Proposed Budget |
|---|---:|
| Product & Technology Development | ₹2,25,000 |
| AI & Predictive Analytics | ₹1,25,000 |
| Cloud Infrastructure | ₹50,000 |
| Pilot Testing & Validation | ₹1,25,000 |
| QR & Inventory Integration | ₹75,000 |
| Legal & Intellectual Property | ₹50,000 |
| Contingency | ₹1,00,000 |
| **Total Target** | **₹7,50,000** |

*The above figures represent proposed budget allocations and are not secured funding.*

### Potential Funding Opportunities

We intend to explore the following Indian startup funding and incubation programmes:

1. **NIDHI-PRAYAS 2.0** – Prototype development support through eligible PRAYAS Centres.
2. **Startup India Seed Fund Scheme (SISFS)** – Potential support for proof of concept, prototype development and product trials, subject to scheme availability and eligibility.
3. **Uttar Pradesh Startup Policy 2026** – Prototype and seed funding opportunities, subject to registration and eligibility conditions.
4. **Startup India Investor Connect** – Connecting with potential angel investors and startup investment networks.
5. **University Incubation Support** – Exploring mentorship, infrastructure, incubation and funding opportunities through the university ecosystem.

*These are prospective funding channels. No grant, investment or funding approval is currently claimed.*

### Investment Utilisation Goals

The proposed funding will support the following milestones:

- Strengthening the OmniStock prototype.
- Improving AI-powered consumption and demand forecasting.
- Developing intelligent low-stock alert mechanisms.
- Conducting pilot testing with commercial kitchens.
- Improving inventory tracking and QR-based operations.
- Preparing the platform for commercial deployment.

### Our Growth Vision

Our objective is to transform OmniStock into a scalable SaaS-based inventory intelligence platform serving restaurants, cafés, hostel messes, institutional kitchens and multi-outlet food businesses.

**Funding Goal: ₹5–10 Lakh**

